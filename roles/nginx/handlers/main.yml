---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nginx
  ansible.builtin.systemd:
    name: "{{ nginx_service_name }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.command: >
    podman exec {{ nginx_unit_name }} nginx -s reload
  changed_when: false
