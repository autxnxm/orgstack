---
- name: Install org apps
  hosts: org_server
  become: true

  tasks:
    - name: Validate app entries
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.name is match('^[a-z0-9_]+$')
      loop: "{{ org_stack.apps | default([]) }}"

    - name: Deploy app roles
      ansible.builtin.include_role:
        name: "app_{{ item.name }}"
      vars:
        app_config: "{{ item }}"
        app_data_dir: "{{ org_data_dir }}/{{ item.name }}"
        app_config_dir: "{{ org_config_dir }}/{{ item.name }}"
      loop: "{{ org_stack.apps | default([]) }}"
      when: item.enabled | default(true)
