---
- name: Install org platform stack
  hosts: org_server
  become: true

  pre_tasks:
    - name: Ensure host has been bootstrapped
      ansible.builtin.stat:
        path: /etc/orgstack-bootstrapped
      register: _orgstack_bootstrap_marker

    - name: Fail if bootstrap has not been run
      ansible.builtin.assert:
        that: _orgstack_bootstrap_marker.stat.exists
        fail_msg: Run 'make bootstrap' before 'make platform'.
        quiet: true

  roles:
    - role: org_dirs

    - role: org_network
      when: org_stack.platform.network | default(false)

    - role: postgres
      when: org_stack.platform.postgres | default(false)

    - role: redis
      when: org_stack.platform.redis | default(false)

    # - role: authentik
    #   when: org_stack.platform.authentik | default(false)
